<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — nowalink</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #26366f, transparent 35%),
                  linear-gradient(135deg, #10131f, #181c2f);
      color: white;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(20, 24, 42, .88);
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #a8aec2; font-size: 13px; margin-bottom: 24px; }
    .drop {
      border: 2px dashed rgba(255,255,255,.2);
      border-radius: 14px;
      padding: 30px 15px;
      cursor: pointer;
      transition: .2s;
      color: #a8aec2;
      font-size: 14px;
    }
    .drop:hover, .drop.drag {
      border-color: #7c9cff;
      background: rgba(124,156,255,.08);
    }
    input[type="file"] { display: none; }
    .status { margin-top: 18px; font-size: 13px; min-height: 20px; color: #a8aec2; }
    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      word-break: break-all;
      font-size: 13px;
      display: none;
    }
    .result a { color: #7c9cff; }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #607ff0;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    .copy-btn:hover { background: #7894ff; }
    .bar-bg {
      margin-top: 14px;
      height: 6px;
      border-radius: 4px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
      display: none;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: #607ff0;
      transition: width .2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Загрузка файла</h1>
    <p class="sub">nowalink / api / upload</p>

    <label class="drop" id="dropZone">
      📎 Нажми или перетащи файл сюда<br><span style="font-size:11px">максимум 20 МБ</span>
      <input type="file" id="fileInput">
    </label>

    <div class="bar-bg" id="barBg"><div class="bar" id="bar"></div></div>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div id="resultLink"></div>
      <button class="copy-btn" onclick="copyLink()">Скопировать ссылку</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vzbgaldclnsedbjjvykq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R-bKrL5gZp0IsMRYgYKZSw_zD9EbHqx";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MAX_FILE_SIZE = 20 * 1024 * 1024;
    let lastPublicUrl = "";

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const resultLink = document.getElementById("resultLink");
    const barBg = document.getElementById("barBg");
    const bar = document.getElementById("bar");

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) uploadFile(fileInput.files[0]);
    });

    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag");
      if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
    });

    function getMyId() {
      let id = localStorage.getItem("presence_id");
      if (!id) {
        id = "user_" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem("presence_id", id);
      }
      return id;
    }

    async function uploadFile(file) {
      if (file.size > MAX_FILE_SIZE) {
        statusEl.textContent = "Файл слишком большой (максимум 20 МБ)";
        return;
      }

      resultEl.style.display = "none";
      barBg.style.display = "block";
      bar.style.width = "10%";
      statusEl.textContent = "Загрузка...";

      const myId = getMyId();
      const path = myId + "/" + Date.now() + "_" + file.name;

      bar.style.width = "50%";

      const { error } = await supabaseClient.storage.from("uploads").upload(path, file);

      if (error) {
        statusEl.textContent = "Ошибка: " + error.message;
        barBg.style.display = "none";
        return;
      }

      bar.style.width = "100%";

      const { data } = supabaseClient.storage.from("uploads").getPublicUrl(path);
      lastPublicUrl = data.publicUrl;

      statusEl.textContent = "Готово ✓";
      resultLink.innerHTML = '<a href="' + lastPublicUrl + '" target="_blank">' + lastPublicUrl + '</a>';
      resultEl.style.display = "block";

      setTimeout(() => { barBg.style.display = "none"; bar.style.width = "0%"; }, 600);
    }

    function copyLink() {
      if (!lastPublicUrl) return;
      navigator.clipboard.writeText(lastPublicUrl);
      statusEl.textContent = "Ссылка скопирована";
    }
  </script>
</body>
</html>
