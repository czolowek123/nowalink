<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Friends</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #26366f, transparent 35%),
        linear-gradient(135deg, #10131f, #181c2f);
      color: white;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      min-height: 650px;
      margin: auto;
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(20, 24, 42, .88);
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
      backdrop-filter: blur(15px);
    }

    .sidebar {
      width: 330px;
      padding: 25px;
      border-right: 1px solid rgba(255,255,255,.1);
      background: rgba(8, 11, 24, .45);
    }

    .logo {
      margin-bottom: 28px;
      font-size: 25px;
      font-weight: bold;
      color: #7c9cff;
    }

    .logo span {
      color: #ffffff;
    }

    .search {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      outline: none;
      color: white;
      background: rgba(255,255,255,.07);
    }

    .search::placeholder {
      color: #8990a8;
    }

    .section-title {
      margin-bottom: 12px;
      color: #939ab5;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px;
      margin-bottom: 9px;
      border-radius: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .user:hover,
    .user.active {
      background: rgba(124,156,255,.18);
    }

    .avatar {
      position: relative;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .avatar.green {
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }

    .avatar.orange {
      background: linear-gradient(135deg, #f7971e, #ffd200);
    }

    .online-dot {
      position: absolute;
      right: 0;
      bottom: 1px;
      width: 12px;
      height: 12px;
      border: 2px solid #15192b;
      border-radius: 50%;
      background: #37e27b;
    }

    .offline .online-dot {
      background: #72788f;
    }

    .user-info {
      min-width: 0;
    }

    .username {
      font-weight: bold;
    }

    .status {
      margin-top: 4px;
      color: #8f97af;
      font-size: 12px;
    }

    .content {
      flex: 1;
      padding: 50px;
    }

    .profile {
      max-width: 650px;
      margin: auto;
      text-align: center;
    }

    .big-avatar {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      border-radius: 50%;
      color: white;
      font-size: 44px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 10px 35px rgba(102,126,234,.35);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .online-text {
      color: #48e58a;
      font-size: 15px;
    }

    .description {
      max-width: 450px;
      margin: 22px auto;
      color: #a8aec2;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 35px;
    }

    .card {
      padding: 20px 10px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      background: rgba(255,255,255,.06);
    }

    .card strong {
      display: block;
      margin-bottom: 7px;
      font-size: 21px;
    }

    .card span {
      color: #969db5;
      font-size: 12px;
    }

    .button {
      margin-top: 30px;
      padding: 13px 24px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      background: #607ff0;
      transition: .2s;
    }

    .button:hover {
      background: #7894ff;
      transform: translateY(-2px);
    }

    .empty-state {
      padding: 20px 13px;
      color: #8990a8;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      body {
        padding: 10px;
      }

      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,.1);
      }

      .content {
        padding: 25px 15px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <aside class="sidebar">
      <div class="logo">Brawlf<span>Online</span></div>

      <input
        class="search"
        type="text"
        placeholder="Поиск пользователей..."
        oninput="searchUsers(this.value)"
      >

      <div class="section-title">Пользователи</div>

      <div id="usersList">
        <div class="empty-state">Загрузка...</div>
      </div>
    </aside>

    <main class="content">
      <div class="profile">
        <div id="bigAvatar" class="big-avatar">?</div>

        <h1 id="profileName">Выбери пользователя</h1>
        <div id="profileStatus" class="online-text">—</div>

        <p class="description">
          Добро пожаловать. Здесь видно, кто сейчас на сайте, и когда
          пользователь заходил в последний раз.
        </p>

        <div class="cards">
          <div class="card">
            <strong id="onlineTime">—</strong>
            <span>Статус</span>
          </div>

          <div class="card">
            <strong id="totalUsers">0</strong>
            <span>Всего видели</span>
          </div>

          <div class="card">
            <strong id="regYear">2026</strong>
            <span>Регистрация</span>
          </div>
        </div>

        <button class="button" onclick="alert('Функция сообщений появится позже')">
          Написать сообщение
        </button>
      </div>
    </main>
  </div>

  <script>
    // ====== НАСТРОЙКИ SUPABASE ======
    const SUPABASE_URL = "https://vzbgaldclnsedbjjvykq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_R-bKrL5gZp0IsMRYgYKZSw_zD9EbHqx";
    // =================================

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // уникальный id для этой вкладки/устройства, живёт в localStorage
    function getMyId() {
      let id = localStorage.getItem("presence_id");
      if (!id) {
        id = "user_" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem("presence_id", id);
      }
      return id;
    }

    function getMyName() {
      let name = localStorage.getItem("presence_name");
      if (!name) {
        name = "Гость" + Math.floor(Math.random() * 1000);
        localStorage.setItem("presence_name", name);
      }
      return name;
    }

    const myId = getMyId();
    const myName = getMyName();

    let usersCache = {};
    let selectedId = null;

    const colors = ["", "green", "orange"];
    function colorFor(id) {
      let hash = 0;
      for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) % 1000;
      return colors[hash % colors.length];
    }

    function timeAgo(dateStr) {
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const sec = Math.floor(diffMs / 1000);
      if (sec < 60) return "только что";
      const min = Math.floor(sec / 60);
      if (min < 60) return min + " мин.";
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return hrs + " ч. " + (min % 60) + " мин.";
      const days = Math.floor(hrs / 24);
      return days + " дн. назад";
    }

    function isOnline(lastSeen) {
      return (Date.now() - new Date(lastSeen).getTime()) < 20000; // 20 сек без пинга = офлайн
    }

    async function upsertMyPresence() {
      await supabaseClient.from("presence").upsert({
        id: myId,
        name: myName,
        last_seen: new Date().toISOString()
      });
    }

    async function loadUsers() {
      const { data, error } = await supabaseClient.from("presence").select("*");
      if (error) {
        document.getElementById("usersList").innerHTML =
          '<div class="empty-state">Ошибка подключения: ' + error.message + '</div>';
        return;
      }
      usersCache = {};
      data.forEach(u => usersCache[u.id] = u);
      renderUsers();
      if (selectedId && usersCache[selectedId]) {
        renderProfile(usersCache[selectedId]);
      } else {
        renderProfile(usersCache[myId]);
        selectedId = myId;
      }
    }

    function renderUsers(filter = "") {
      const list = document.getElementById("usersList");
      const users = Object.values(usersCache)
        .filter(u => u.name.toLowerCase().includes(filter.toLowerCase()))
        .sort((a, b) => new Date(b.last_seen) - new Date(a.last_seen));

      document.getElementById("totalUsers").textContent = Object.keys(usersCache).length;

      if (users.length === 0) {
        list.innerHTML = '<div class="empty-state">Никого не найдено</div>';
        return;
      }

      list.innerHTML = users.map(u => {
        const online = isOnline(u.last_seen);
        const color = colorFor(u.id);
        return `
          <div class="user ${u.id === selectedId ? 'active' : ''} ${online ? '' : 'offline'}" onclick="selectUser('${u.id}')">
            <div class="avatar ${color}">
              ${u.name.charAt(0).toUpperCase()}
              <div class="online-dot"></div>
            </div>
            <div class="user-info">
              <div class="username">${u.name}${u.id === myId ? ' (ты)' : ''}</div>
              <div class="status">${online ? 'Онлайн' : 'Был(а) ' + timeAgo(u.last_seen)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderProfile(u) {
      if (!u) return;
      const online = isOnline(u.last_seen);
      const color = colorFor(u.id);

      document.getElementById("profileName").textContent = u.name + (u.id === myId ? " (ты)" : "");
      document.getElementById("bigAvatar").textContent = u.name.charAt(0).toUpperCase();
      document.getElementById("bigAvatar").className = "big-avatar " + color;
      document.getElementById("profileStatus").textContent = online ? "● Сейчас онлайн" : "○ Не в сети";
      document.getElementById("profileStatus").style.color = online ? "#48e58a" : "#8990a8";
      document.getElementById("onlineTime").textContent = online ? "Онлайн" : timeAgo(u.last_seen);
    }

    function selectUser(id) {
      selectedId = id;
      renderProfile(usersCache[id]);
      renderUsers(document.querySelector(".search").value);
    }

    function searchUsers(value) {
      renderUsers(value);
    }

    // первый заход + пинг каждые 8 сек чтобы показывать "онлайн"
    upsertMyPresence();
    setInterval(upsertMyPresence, 8000);

    // подписка на realtime изменения у всех пользователей
    supabaseClient
      .channel("presence-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "presence" }, loadUsers)
      .subscribe();

    loadUsers();
    // обновляем текст "N мин назад" каждую минуту даже без новых событий
    setInterval(() => { renderUsers(document.querySelector(".search").value); if(selectedId) renderProfile(usersCache[selectedId]); }, 30000);
  </script>
</body>
</html>
