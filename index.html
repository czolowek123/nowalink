<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BrawlfOnline</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#212121;--panel:#171717;--panel2:#2a2a2a;--line:#3a3a3a;--text:#ececec;--muted:#a6a6a6;--blue:#2879e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}.sidebar{background:#181818;border-right:1px solid #303030;padding:14px 10px;overflow:auto}.brand{padding:7px 10px 20px;font-size:18px;font-weight:700}.brand span{color:#929292;font-weight:500}.me{margin:0 5px 16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#222}.me-name{font-weight:600}.me-hint{color:var(--muted);font-size:12px;margin-top:4px}.section{font-size:12px;color:var(--muted);padding:0 10px 8px;text-transform:uppercase;letter-spacing:.06em}.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;margin:2px 0}.user:hover,.user.active{background:#303030}.avatar{width:30px;height:30px;flex:none;border-radius:50%;background:linear-gradient(135deg,#5375b8,#8c5eb9);display:grid;place-items:center;font-weight:700}.dot{width:8px;height:8px;border-radius:99px;background:#32c86a;box-shadow:0 0 0 2px #303030;margin-left:auto}.content{min-width:0;display:flex;flex-direction:column;background:#212121}.topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #333;font-weight:600;font-size:16px}.empty{margin:auto;text-align:center;color:var(--muted);line-height:1.6}.empty h1{color:var(--text);font-size:26px}.chat{display:none;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:24px max(24px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:18px}.message{display:flex;gap:11px;max-width:760px}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message-avatar{width:28px;height:28px;border-radius:50%;background:#444;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}.bubble{padding:10px 13px;border-radius:12px;background:#303030;line-height:1.45;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:#245a9d}.author{font-size:12px;color:var(--muted);margin:0 0 4px}.mine .author{text-align:right}.composer{width:min(760px,calc(100% - 48px));margin:0 auto 22px;display:flex;gap:9px;align-items:end;border:1px solid #444;border-radius:15px;background:#2b2b2b;padding:8px 8px 8px 14px}.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:9px 0}.composer button,.login button{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;padding:9px 14px}.composer button:disabled{opacity:.45;cursor:not-allowed}.login-wrap{position:fixed;inset:0;background:#161616e8;z-index:3;display:grid;place-items:center;padding:20px}.login-wrap[hidden]{display:none}.login{width:min(390px,100%);background:#262626;border:1px solid #414141;border-radius:16px;padding:25px;box-shadow:0 20px 50px #0008}.login h1{margin:0 0 8px;font-size:23px}.login p{color:var(--muted);line-height:1.5}.login input{width:100%;margin:12px 0;border:1px solid #4a4a4a;border-radius:9px;background:#191919;padding:12px;color:#fff;outline:0}.login button{width:100%}.error{color:#ff9b9b!important;min-height:20px;font-size:12px}@media(max-width:650px){.app{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding:10px 6px}.brand{font-size:15px}.topbar{padding:0 14px}.messages{padding:16px}.composer{width:calc(100% - 24px)}.user-name{max-width:100px;overflow:hidden;text-overflow:ellipsis}.me{font-size:12px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand">Brawlf<span>Online</span></div><div id="meBox" class="me" hidden><div class="me-name"></div><div class="me-hint">Вы онлайн</div></div><div class="section">Пользователи онлайн</div><div id="users"></div></aside>
    <main class="content"><header id="title" class="topbar">Чат</header><section id="empty" class="empty"><h1>Выберите пользователя</h1><p>Нажмите на имя в боковой панели, чтобы открыть переписку.</p></section><section id="chat" class="chat"><div id="messages" class="messages"></div><div class="composer"><input id="messageInput" maxlength="1000" placeholder="Написать сообщение…"><button id="send">Отправить</button></div></section></main>
  </div>
  <div id="loginWrap" class="login-wrap"><div class="login"><h1>Вход в чат</h1><p>Придумайте username без пробелов. Разрешены английские буквы, цифры и <b>_</b>: например, <b>user111</b>.</p><input id="username" maxlength="24" placeholder="user111" autocomplete="username"><button id="enter">Войти</button><p id="loginError" class="error"></p></div></div>
  <script>
    // Эти данные можно оставить: это тот же Supabase-проект, что был в вашем файле.
    const SUPABASE_URL='https://vzbgaldclnsedbjjvykq.supabase.co';
    const SUPABASE_KEY='sb_publishable_R-bKrL5gZp0IsMRYgYKZSw_zD9EbHqx';
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const USERNAME=/^[A-Za-z0-9_]{3,24}$/; const ONLINE=15000;
    let me='', selected='', users=[], messages=[];
    const $=s=>document.querySelector(s); const esc=s=>{const x=document.createElement('span');x.textContent=s;return x.innerHTML};
    const isOnline=u=>Date.now()-new Date(u.last_seen).getTime()<ONLINE;
    async function heartbeat(){if(me) await db.from('presence').upsert({id:me,name:me,last_seen:new Date().toISOString()});}
    async function loadUsers(){const {data,error}=await db.from('presence').select('*').order('last_seen',{ascending:false});if(error)return;users=(data||[]).filter(isOnline);if(selected&&!users.some(u=>u.id===selected))selected='';renderUsers();}
    function renderUsers(){const box=$('#users');box.innerHTML=users.length?users.map(u=>`<div class="user ${u.id===selected?'active':''}" data-id="${esc(u.id)}"><div class="avatar">${esc(u.name[0].toUpperCase())}</div><div class="user-name">${esc(u.name)}${u.id===me?' (вы)':''}</div><i class="dot"></i></div>`).join(''):'<div class="me-hint" style="padding:10px">Никого нет онлайн</div>';box.querySelectorAll('.user').forEach(x=>x.onclick=()=>openChat(x.dataset.id));}
    async function openChat(id){if(id===me)return;selected=id;$('#title').textContent='Чат с '+id;$('#empty').style.display='none';$('#chat').style.display='flex';renderUsers();const {data}=await db.from('messages').select('*').or(`and(sender_id.eq.${me},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me})`).order('created_at',{ascending:true});messages=data||[];renderMessages();}
    function renderMessages(){const box=$('#messages');box.innerHTML=messages.length?messages.map(m=>`<div class="message ${m.sender_id===me?'mine':''}"><div class="message-avatar">${esc(m.sender_id[0].toUpperCase())}</div><div><div class="author">${esc(m.sender_id)}</div><div class="bubble">${esc(m.content)}</div></div></div>`).join(''):'<div class="empty">Сообщений пока нет.</div>';box.scrollTop=box.scrollHeight;}
    async function send(){const input=$('#messageInput'),content=input.value.trim();if(!selected||!content)return;$('#send').disabled=true;const {error}=await db.from('messages').insert({sender_id:me,receiver_id:selected,content});$('#send').disabled=false;if(error){alert('Ошибка: '+error.message);return;}input.value='';}
    async function enter(){const username=$('#username').value.trim();if(!USERNAME.test(username)){$('#loginError').textContent='Имя должно состоять из 3–24 символов A-Z, 0-9 или _; пробелы нельзя.';return;}me=username;localStorage.setItem('brawlf_username',me);await heartbeat();$('#loginWrap').hidden=true;$('#meBox').hidden=false;$('#meBox .me-name').textContent=me;await loadUsers();}
    $('#enter').onclick=enter;$('#username').onkeydown=e=>{if(e.key==='Enter')enter()};$('#send').onclick=send;$('#messageInput').onkeydown=e=>{if(e.key==='Enter')send()};
    const saved=localStorage.getItem('brawlf_username');if(saved){$('#username').value=saved;enter();}
    db.channel('chat-live').on('postgres_changes',{event:'*',schema:'public',table:'presence'},loadUsers).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(selected&&((m.sender_id===me&&m.receiver_id===selected)||(m.sender_id===selected&&m.receiver_id===me))){messages.push(m);renderMessages();}}).subscribe();
    setInterval(heartbeat,5000);setInterval(loadUsers,5000);
  </script>
</body>
</html>
